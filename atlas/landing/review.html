<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Florida Coastal landing heroes</title><style>body{font:16px system-ui;background:#f3eddc;color:#345047;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px}img{width:100%;display:block}figure{margin:0;background:#fffaf0}figcaption{padding:16px}a{color:inherit}p{line-height:1.5}</style><h1>Town landing heroes</h1><p>35 towns · 1600×1000 desktop · 800×1000 phone · unchanged tilt and span.</p><p><a href="index.json">Hero, callout and camera manifest</a> · <a href="hero-sources.json">OSM sources and frame checks</a></p><main><figure><a href="30a.webp"><img loading="lazy" src="30a.webp" alt="30A (Santa Rosa Beach)"></a><figcaption><strong>30A (Santa Rosa Beach)</strong> · <a href="30a-m.webp">Phone crop</a><p>Seaside’s square puts the pastel village and its Gulf beach together in one frame.</p><small>3 callouts inside both frames</small></figcaption></figure><figure><a href="dunedin.webp"><img loading="lazy" src="dunedin.webp" alt="Dunedin"></a><figcaption><strong>Dunedin</strong> · <a href="dunedin-m.webp">Phone crop</a><p>The municipal marina and Main Street waterfront express Dunedin’s boating and walkable-town character.</p><small>3 callouts inside both frames</small></figcaption></figure><figure><a href="clearwaterbeach.webp"><img loading="lazy" src="clearwaterbeach.webp" alt="Clearwater Beach"></a><figcaption><strong>Clearwater Beach</strong> · <a href="clearwaterbeach-m.webp">Phone crop</a><p>The landward entrance to Pier 60 centers Clearwater Beach’s Gulf sand and resort waterfront.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="gulfport.webp"><img loading="lazy" src="gulfport.webp" alt="Gulfport"></a><figcaption><strong>Gulfport</strong> · <a href="gulfport-m.webp">Phone crop</a><p>The small-town waterfront and beach show Gulfport’s low-rise Boca Ciega Bay character.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="ami.webp"><img loading="lazy" src="ami.webp" alt="Anna Maria Island"></a><figcaption><strong>Anna Maria Island</strong> · <a href="ami-m.webp">Phone crop</a><p>Anna Maria’s historic pier anchors the bayfront end of Pine Avenue.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="longboat.webp"><img loading="lazy" src="longboat.webp" alt="Longboat Key"></a><figcaption><strong>Longboat Key</strong> · <a href="longboat-m.webp">Phone crop</a><p>This mid-island Gulf-front anchor shows Longboat’s narrow beach, resort strip and residential island fabric.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="apollo-beach.webp"><img loading="lazy" src="apollo-beach.webp" alt="Apollo Beach"></a><figcaption><strong>Apollo Beach</strong> · <a href="apollo-beach-m.webp">Phone crop</a><p>The bayfront nature park frames Apollo Beach’s water-oriented residential shoreline.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="clearwater.webp"><img loading="lazy" src="clearwater.webp" alt="Clearwater"></a><figcaption><strong>Clearwater</strong> · <a href="clearwater-m.webp">Phone crop</a><p>Coachman Park connects downtown Clearwater to its harbor waterfront.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="indian-rocks-beach.webp"><img loading="lazy" src="indian-rocks-beach.webp" alt="Indian Rocks Beach"></a><figcaption><strong>Indian Rocks Beach</strong> · <a href="indian-rocks-beach-m.webp">Phone crop</a><p>The civic beach-town center keeps the Gulf edge and low-rise neighborhood together.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="madeira-beach.webp"><img loading="lazy" src="madeira-beach.webp" alt="Madeira Beach"></a><figcaption><strong>Madeira Beach</strong> · <a href="madeira-beach-m.webp">Phone crop</a><p>John’s Pass working marina and inlet define Madeira Beach’s boating waterfront.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="new-port-richey.webp"><img loading="lazy" src="new-port-richey.webp" alt="New Port Richey"></a><figcaption><strong>New Port Richey</strong> · <a href="new-port-richey-m.webp">Phone crop</a><p>Sims Park and the Pithlachascotee River anchor the historic downtown.</p><small>3 callouts inside both frames</small></figcaption></figure><figure><a href="ruskin.webp"><img loading="lazy" src="ruskin.webp" alt="Ruskin"></a><figcaption><strong>Ruskin</strong> · <a href="ruskin-m.webp">Phone crop</a><p>Domino Park’s boat ramp opens onto Mill Bayou and the Little Manatee River, expressing Ruskin’s boating character.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="safety-harbor.webp"><img loading="lazy" src="safety-harbor.webp" alt="Safety Harbor"></a><figcaption><strong>Safety Harbor</strong> · <a href="safety-harbor-m.webp">Phone crop</a><p>The waterfront park and Main Street end bring the bay and compact downtown together.</p><small>4 callouts inside both frames</small></figcaption></figure><figure><a href="st-pete-beach.webp"><img loading="lazy" src="st-pete-beach.webp" alt="St. Pete Beach"></a><figcaption><strong>St. Pete Beach</strong> · <a href="st-pete-beach-m.webp">Phone crop</a><p>The pink Don CeSar is the recognizable Gulf-front landmark of St. Pete Beach.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="st-petersburg.webp"><img loading="lazy" src="st-petersburg.webp" alt="St. Petersburg"></a><figcaption><strong>St. Petersburg</strong> · <a href="st-petersburg-m.webp">Phone crop</a><p>The downtown waterfront park frames the skyline, marina basin and approach to the Pier.</p><small>4 callouts inside both frames</small></figcaption></figure><figure><a href="sun-city-center.webp"><img loading="lazy" src="sun-city-center.webp" alt="Sun City Center"></a><figcaption><strong>Sun City Center</strong> · <a href="sun-city-center-m.webp">Phone crop</a><p>The central recreation campus represents this inland retirement community; there is no coastal waterfront here.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="tampa.webp"><img loading="lazy" src="tampa.webp" alt="Tampa"></a><figcaption><strong>Tampa</strong> · <a href="tampa-m.webp">Phone crop</a><p>The Riverwalk bend places downtown Tampa and the Hillsborough River at the heart of the image.</p><small>4 callouts inside both frames</small></figcaption></figure><figure><a href="tarpon-springs.webp"><img loading="lazy" src="tarpon-springs.webp" alt="Tarpon Springs"></a><figcaption><strong>Tarpon Springs</strong> · <a href="tarpon-springs-m.webp">Phone crop</a><p>The sponge docks and Anclote River show Tarpon Springs’ distinctive working waterfront.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="treasure-island.webp"><img loading="lazy" src="treasure-island.webp" alt="Treasure Island"></a><figcaption><strong>Treasure Island</strong> · <a href="treasure-island-m.webp">Phone crop</a><p>The wide Gulf beachfront frames Treasure Island’s resort and residential strip.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="bradenton.webp"><img loading="lazy" src="bradenton.webp" alt="Bradenton"></a><figcaption><strong>Bradenton</strong> · <a href="bradenton-m.webp">Phone crop</a><p>The Riverwalk puts the Manatee River and downtown Bradenton together.</p><small>3 callouts inside both frames</small></figcaption></figure><figure><a href="bradenton-beach.webp"><img loading="lazy" src="bradenton-beach.webp" alt="Bradenton Beach"></a><figcaption><strong>Bradenton Beach</strong> · <a href="bradenton-beach-m.webp">Phone crop</a><p>The bayfront end of Bridge Street frames the old beach-town main street and pier approach.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="cortez.webp"><img loading="lazy" src="cortez.webp" alt="Cortez"></a><figcaption><strong>Cortez</strong> · <a href="cortez-m.webp">Phone crop</a><p>The fish-house waterfront on Sarasota Bay captures Cortez’s working fishing-village identity.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="englewood.webp"><img loading="lazy" src="englewood.webp" alt="Englewood"></a><figcaption><strong>Englewood</strong> · <a href="englewood-m.webp">Phone crop</a><p>The Lemon Bay waterfront and nearby Old Englewood blocks convey the town’s quiet boating character.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="sarasota.webp"><img loading="lazy" src="sarasota.webp" alt="Sarasota"></a><figcaption><strong>Sarasota</strong> · <a href="sarasota-m.webp">Phone crop</a><p>The Ringling Causeway approach frames the bayfront marina, bridge and downtown Sarasota.</p><small>3 callouts inside both frames</small></figcaption></figure><figure><a href="siesta-key.webp"><img loading="lazy" src="siesta-key.webp" alt="Siesta Key"></a><figcaption><strong>Siesta Key</strong> · <a href="siesta-key-m.webp">Phone crop</a><p>The public beach park anchors Siesta Key’s broad white-sand Gulf frontage.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="venice.webp"><img loading="lazy" src="venice.webp" alt="Venice"></a><figcaption><strong>Venice</strong> · <a href="venice-m.webp">Phone crop</a><p>Venice Beach puts the Gulf and the town’s coastal neighborhood in the same frame.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="miami.webp"><img loading="lazy" src="miami.webp" alt="Miami"></a><figcaption><strong>Miami</strong> · <a href="miami-m.webp">Phone crop</a><p>Bayfront Park frames Biscayne Bay beside Miami’s downtown skyline.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="southbeach.webp"><img loading="lazy" src="southbeach.webp" alt="Miami (South Beach)"></a><figcaption><strong>Miami (South Beach)</strong> · <a href="southbeach-m.webp">Phone crop</a><p>Ocean Drive and Lummus Park pair the Art Deco frontage with South Beach’s ocean edge.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="naples.webp"><img loading="lazy" src="naples.webp" alt="Naples"></a><figcaption><strong>Naples</strong> · <a href="naples-m.webp">Phone crop</a><p>Historic Palm Cottage anchors Old Naples beside Third Street South and the Gulf beachfront.</p><small>2 callouts inside both frames</small></figcaption></figure><figure><a href="marco-island.webp"><img loading="lazy" src="marco-island.webp" alt="Marco Island"></a><figcaption><strong>Marco Island</strong> · <a href="marco-island-m.webp">Phone crop</a><p>Tigertail’s lagoon, white sand and nearby canal homes show Marco Island’s coastal character.</p><small>1 callouts inside both frames</small></figcaption></figure><figure><a href="everglades-city.webp"><img loading="lazy" src="everglades-city.webp" alt="Everglades City"></a><figcaption><strong>Everglades City</strong> · <a href="everglades-city-m.webp">Phone crop</a><p>The historic Rod and Gun Club on the Barron River anchors Everglades City’s fishing-town waterfront.</p><small>4 callouts inside both frames</small></figcaption></figure><figure><a href="chokoloskee.webp"><img loading="lazy" src="chokoloskee.webp" alt="Chokoloskee"></a><figcaption><strong>Chokoloskee</strong> · <a href="chokoloskee-m.webp">Phone crop</a><p>Smallwood Store’s bayfront setting captures Chokoloskee’s historic trading-post and fishing-island identity.</p><small>3 callouts inside both frames</small></figcaption></figure><figure><a href="pensacola.webp"><img loading="lazy" src="pensacola.webp" alt="Pensacola"></a><figcaption><strong>Pensacola</strong> · <a href="pensacola-m.webp">Phone crop</a><p>Palafox Pier connects Pensacola’s historic main street to its working bayfront.</p><small>5 callouts inside both frames</small></figcaption></figure><figure><a href="jacksonville.webp"><img loading="lazy" src="jacksonville.webp" alt="Jacksonville"></a><figcaption><strong>Jacksonville</strong> · <a href="jacksonville-m.webp">Phone crop</a><p>Friendship Fountain frames the St. Johns River, Main Street Bridge and Jacksonville’s downtown skyline.</p><small>4 callouts inside both frames</small></figcaption></figure><figure><a href="pensacola-beach.webp"><img loading="lazy" src="pensacola-beach.webp" alt="Pensacola Beach"></a><figcaption><strong>Pensacola Beach</strong> · <a href="pensacola-beach-m.webp">Phone crop</a><p>The pier entrance frames Casino Beach, the water tower and the narrow island between Gulf and sound.</p><small>3 callouts inside both frames</small></figcaption></figure></main><p>© OpenStreetMap contributors · ESA WorldCover 2021 · Tampa/USF canopy where used. See atlas README for full attribution.</p></html>
